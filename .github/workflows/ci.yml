name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every Node line the package supports (`engines.node >= 20.6`).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      # Reproducible install from the committed lockfile — the build toolchain is
      # pinned, so a compromised devDep release can't silently enter a CI run.
      - run: npm ci --no-audit --no-fund
      # Vulnerability gate. Runtime deps are zero by design, so this audits the
      # dev toolchain only — gate on critical to stay signal, not noise.
      - run: npm audit --audit-level=critical
      # Use the package's own scripts (not `npx <tool>`) — `npm run` puts
      # node_modules/.bin on PATH, so the LOCAL tsc/eslint/tsup are used and npm
      # never falls back to fetching an unrelated package from the registry.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The built binary must at least load and report its version.
      - run: node dist/bin.js --version
